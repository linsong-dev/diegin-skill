name: 功能建议
description: 建议迭进新规则、新能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你希望迭进帮你避免/改进什么？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 具体规则/机制/交互设想（越具体越好，可附示例输入输出）
  - type: dropdown
    id: scope
    attributes:
      label: 属于哪一原则
      options:
        - 攻七（正向强化/推荐）
        - 守三（负向纠错）
        - 一二不过三（安全阀）
        - 举一反三（跨域泛化）
        - 去伪存真（真伪门）
        - 其他/不确定
  - type: checkboxes
    id: confirm
    attributes:
      label: 参考
      options:
        - label: 已搜索 issues，确认无重复建议